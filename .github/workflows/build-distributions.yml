name: Build GPT distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
            if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            version="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid VERSION: $version" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        run: python3 scripts/build_distributions.py --version '${{ steps.version.outputs.version }}'
      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version '${{ steps.version.outputs.version }}'
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-code-delivery-assistant-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          retention-days: 30
      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.zip --clobber
